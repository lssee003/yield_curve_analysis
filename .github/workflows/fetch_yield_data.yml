name: Fetch & Store Yield Curve Data

on:
  schedule:
    - cron: '0 0 * * 1'  # Runs every Monday at 00:00 UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  fetch-yield-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Load Environment Variables
        run: echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV

      - name: Test Database Connection
        run: |
          python -c "
          import psycopg2
          import os
          DATABASE_URL = os.getenv('DATABASE_URL')
          try:
              conn = psycopg2.connect(DATABASE_URL)
              print('✅ Database connection successful!')
          except Exception as e:
              print(f'❌ Database connection failed: {e}')
          "

      - name: Debug XML Response
        run: |
          python -c "
          import requests
          url = 'https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value=all&page=0'
          response = requests.get(url)
          print(response.text)
          "

      - name: Fetch & Store Yield Data
        run: python backend/fetch_store_yields.py